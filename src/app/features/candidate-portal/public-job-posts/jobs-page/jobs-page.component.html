<div class="jobs-page">
  <!-- Hero -->
  <app-jobs-hero />

  <!-- Search (overlaps hero) -->
  <app-jobs-search (search)="onSearchInput($event)" (apply)="onApplyFilters()" />

  <!-- Filters + List -->
  <section class="jobs-content">
    <div class="jobs-layout">
      <app-jobs-filters (filtersChange)="onFiltersChange($event)" />
      <app-jobs-list
        [jobs]="jobs()"
        [totalRecords]="totalCount()"
        [first]="(page() - 1) * rows"
        [rows]="rows"
        [isLoading]="isLoading()"
        (pageChange)="onPageChange($event)" />
    </div>
  </section>
</div>
