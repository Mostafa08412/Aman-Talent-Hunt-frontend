<div class="search-wrapper">
  <div class="search-bar">

    <!-- Keyword -->
    <div class="search-field">
      <i class="pi pi-search field-icon"></i>
      <input
        pInputText
        type="text"
        placeholder="Job title, keyword or skillset..."
        [(ngModel)]="keyword"
        (ngModelChange)="onInput()"
        (keyup.enter)="onApply()" />
    </div>

    <div class="divider"></div>

    <!-- Location -->
    <div class="location-field">
      <i class="pi pi-map-marker field-icon"></i>
      <p-select
        [options]="locationOptions"
        [(ngModel)]="selectedLocation"
        (ngModelChange)="onInput()"
        optionLabel="label"
        optionValue="value"
        placeholder="All Cities"
        styleClass="location-select"
        [showClear]="false" />
    </div>

    <div class="divider"></div>

    <!-- Department -->
    <div class="location-field department-field">
      <i class="pi pi-building field-icon"></i>
      <p-select
        [options]="departmentOptions"
        [(ngModel)]="selectedDepartmentId"
        (ngModelChange)="onInput()"
        optionLabel="label"
        optionValue="value"
        placeholder="All Departments"
        styleClass="location-select"
        [showClear]="true" />
    </div>

    <!-- Actions -->
    <div class="actions">
      <p-button
        label="Search Roles"
        icon="pi pi-arrow-right"
        iconPos="right"
        (onClick)="onApply()"
        styleClass="search-btn" />
    </div>

  </div>
</div>
