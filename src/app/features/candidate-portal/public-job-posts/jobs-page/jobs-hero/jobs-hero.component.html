<section class="jobs-hero">
  <div class="hero-overlay"></div>
  <div class="hero-glow"></div>

  <div class="hero-content">
    <div class="hero-text">
      <span class="eyebrow">Join AMAN</span>

      <h1>
        Move your career forward,<br />
        <span class="highlight">with confidence</span>
      </h1>

      <p class="description">
        Browse impactful roles across Consumer Finance, Microfinance, and
        Digital Payments.
        Build the future of fintech in Egypt.
      </p>

      <div class="stats">
        <div class="stat">
          <span class="stat-value">{{ openRoles }}</span>
          <span class="stat-label">Open Roles</span>
        </div>

        <div class="divider"></div>

        <div class="stat">
          <span class="stat-value">{{ businessUnits }}</span>
          <span class="stat-label">Business Units</span>
        </div>

        <div class="divider"></div>

        <div class="stat">
          <span class="stat-value">{{ teamMembers }}</span>
          <span class="stat-label">Team Members</span>
        </div>
      </div>
    </div>
  </div>

</section>
