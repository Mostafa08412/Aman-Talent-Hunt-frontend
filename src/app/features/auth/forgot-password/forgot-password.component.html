<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Forgot Password?</h1>
    <p class="subtitle">Enter your email address to reset your password.</p>

    @if (error()) {
      <p-message severity="error" [text]="error()!" styleClass="w-full" />
    }

    <div class="field">
      <label for="fpw-email">Email</label>
      <input pInputText id="fpw-email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </div>

    <button pButton type="submit" label="Send Reset Code" [loading]="loading()" class="w-full"></button>

    <a routerLink="/login" class="back-link">Back to Login</a>
  </form>
</div>
