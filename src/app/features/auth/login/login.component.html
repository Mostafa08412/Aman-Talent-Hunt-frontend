<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Sign in</h1>
    <p class="subtitle">Aman Talent Hunt — Recruiter &amp; HR Console</p>

    @if (error()) {
      <p-message severity="error" [text]="error()!" styleClass="w-full" />
    }

    <div class="field">
      <label for="login-email">Email</label>
      <input pInputText id="login-email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <p-password
        id="login-password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="field-error">Password is required.</small>
      }
    </div>

    <a routerLink="/forgot-password" class="forgot-password">
      Forgot Password?
    </a>

    <button pButton type="submit" label="Sign In" [loading]="loading()" class="w-full"></button>
  </form>
</div>
