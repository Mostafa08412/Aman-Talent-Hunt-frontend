<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" (click)="toggleSidebar.emit()"
      aria-label="Toggle sidebar">
      <i class="pi pi-bars"></i>
    </button>
    <span class="topbar-title">AMAN Console</span>
  </div>

  <div class="topbar-right">
    <button class="icon-btn" (click)="toggleDarkMode()"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>

    <button class="icon-btn" aria-label="Search">
      <i class="pi pi-search"></i>
    </button>

    <button class="icon-btn" routerLink="/console/approvals"
      aria-label="Pending approvals">
      @if (pendingApprovals() > 0) {
      <i class="pi pi-bell" pBadge [value]="pendingApprovals()"
        severity="danger"></i>
      } @else {
      <i class="pi pi-bell"></i>
      }
    </button>

    <div class="user-divider"></div>

    <button class="user-btn" (click)="userMenu.toggle($event)">
      <div class="user-info">
        <span class="user-name">{{ currentUser()?.fullName }}</span>
        <span class="user-role">{{ currentUser()?.email }}</span>
      </div>
      <i class="pi pi-chevron-down user-chevron"></i>
    </button>
    <p-menu #userMenu [model]="userMenuItems" [popup]="true"
      class="admin-user-menu" styleClass="user-popup-menu" />
  </div>
</header>
